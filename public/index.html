<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <title>msg-hub · agent 工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    // Keep this key in sync with SIDE_COLLAPSED_KEY in app.js.
    try {
      if (localStorage.getItem("msghub.sideCollapsed") === "1") {
        document.documentElement.classList.add("side-collapsed");
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="app">
    <div id="scrim" class="scrim" hidden></div>

    <aside id="sidebar">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 5.5h8a3.5 3.5 0 0 1 3.5 3.5v3a3.5 3.5 0 0 1-3.5 3.5H10l-3.5 3v-3.2A3.5 3.5 0 0 1 3 11.8v-2.8a3.5 3.5 0 0 1 3.5-3.5Z"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>msg-hub</h1>
          <p class="sub">agent 工作台</p>
        </div>
      </header>

      <button id="side-toggle" class="side-toggle" type="button"
              aria-controls="sidebar" aria-expanded="true"
              aria-label="收起侧边栏" title="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m14 6-6 6 6 6"/>
        </svg>
      </button>

      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="5.5"/>
          <path d="M14.6 14.6 19 19"/>
        </svg>
        <input id="room-search" type="search" placeholder="搜索群聊和伙伴" aria-label="搜索群聊和伙伴" autocomplete="off" spellcheck="false">
      </div>

      <div class="side-scroll">
        <div class="side-label"><span>群聊</span></div>
        <nav id="rooms" aria-label="群聊"></nav>

        <div class="side-label"><span>伙伴</span></div>
        <div id="people" class="people" aria-label="伙伴"></div>
      </div>

      <footer class="side-foot">
        <div class="me-line">
          <span id="me-avatar" class="avatar avatar-sm" aria-hidden="true">我</span>
          <div class="me-field">
            <span id="me-name" class="me-name">未设置身份</span>
            <div class="me-edit-field">
              <label class="me-label" for="identity">我的身份</label>
              <input id="identity" value="" placeholder="输入身份，如 me" aria-label="我的身份" maxlength="32" spellcheck="false">
            </div>
          </div>
          <button id="me-edit" class="me-edit" type="button"
                  aria-controls="identity" aria-expanded="false"
                  aria-label="编辑我的身份">编辑</button>
        </div>
        <div class="conn-line">
          <span id="conn-dot" class="dot" aria-hidden="true"></span>
          <span id="conn-text">连接中</span>
          <button id="token-btn" class="link" type="button" hidden>换 token</button>
        </div>
      </footer>
    </aside>

    <main id="main">
      <header id="room-head">
        <button id="menu" class="icon-btn menu" type="button" aria-label="打开列表" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="room-heading">
          <h2 id="room-title">全部</h2>
          <p id="room-sub" class="sub">所有房间的消息</p>
        </div>
        <div id="room-meta" class="meta"></div>
      </header>

      <div id="timeline" class="timeline">
        <section id="messages" aria-live="polite"></section>
        <button id="jump-latest" class="jump-latest" type="button" aria-label="回到底部，看最新消息" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg>
          <span class="jump-label">回到底部</span>
          <span id="jump-count" class="jump-count" hidden></span>
        </button>
      </div>

      <form id="composer" autocomplete="off">
        <div id="mention-menu" class="mention-menu" role="listbox" aria-label="提及身份" hidden></div>
        <div class="composer-card">
          <div id="reply-chip" class="reply-chip" hidden>
            <span id="reply-chip-text" class="reply-chip-text"></span>
            <button type="button" id="reply-cancel" class="chip-x" aria-label="取消回复">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
            </button>
          </div>
          <div id="file-chips" class="file-chips" hidden></div>
          <textarea id="input" rows="1" aria-label="消息内容" placeholder="说点什么，@ 谁谁被唤起…"></textarea>
          <div class="composer-toolbar">
            <button type="button" id="attach-btn" class="icon-btn plus" aria-label="交接文件" title="交接文件（≤20MB）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="file-input" multiple hidden>
            <span class="hint">Enter 发送 · Shift+Enter 换行</span>
            <span id="send-status" class="status" role="status"></span>
            <button type="submit" id="send" class="send" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div id="token-modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="token-title">
      <h2 id="token-title">需要 token</h2>
      <p id="token-message" class="sub">从 <code>data/token.txt</code> 读取后粘贴到这里。token 只保存在本机浏览器。</p>
      <input id="token-input" type="text" autocomplete="off" spellcheck="false" placeholder="Bearer token">
      <div class="modal-actions">
        <button id="token-save" type="button" class="button-primary">保存并连接</button>
      </div>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-card">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V5M7.5 9.5 12 5l4.5 4.5"/>
          <path d="M5 15v2.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V15"/>
        </svg>
      </span>
      <strong>松开，把文件交给聊天室</strong>
      <span class="sub">上传后会生成一条带备注的文件交接消息</span>
    </div>
  </div>

  <script>window.__MSGHUB_TOKEN__ = __MSGHUB_TOKEN_JSON__;</script>
  <script src="/app.js"></script>
</body>
</html>
